<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evan Kravitz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0e0e0e;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 520px;
            text-align: center;
        }

        .name {
            font-size: 2.8rem;
            font-weight: 300;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
            color: #ffffff;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: #444;
            margin: 0 auto 1.25rem;
        }

        .tagline {
            font-size: 1rem;
            font-weight: 400;
            color: #888;
            letter-spacing: 0.04em;
            margin-bottom: 2.5rem;
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        .links a {
            color: #999;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 0.6rem 1.2rem;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            transition: color 0.3s, border-color 0.3s;
        }

        .links a:hover {
            color: #fff;
            border-color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="name">Evan Kravitz</h1>
        <div class="divider"></div>
        <p class="tagline">Software Engineer</p>
        <div class="links">
            <a href="https://github.com/evakravi">GitHub</a>
        </div>
    </div>
</body>
</html>
